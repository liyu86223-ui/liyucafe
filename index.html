$('#app').innerHTML=`<header class="topbar"><div class="brand row"><div class="brand-mark">${icon('cup')}</div><span>生活本</span></div><div class="top-tools"><div class="date-nav"><button class="date-label" data-action="open-picker" popovertarget="date-picker" aria-label="选择日期" aria-expanded="false" aria-controls="date-picker"><span>${navLabel()}</span></button></div>${!isCurrent?'<button class="today-btn" data-action="today">今天</button>':''}<div class="view-switch desktop-switch">${navViews()}</div><button class="btn primary pill desktop-new" data-action="new-record">${icon('plus')}记一笔</button></div><button class="icon-btn" data-action="settings" aria-label="设置">${icon('settings')}</button></header>
<main class="page ${view==='day'?'day-home':'month-home'}">
${storageError?'<div class="storage-error" role="alert">浏览器储存暂时不可用，新记录还没有持久保存。请先在设置中导出备份，再尝试重新打开。</div>':''}
${view==='day'?`${renderOverview(list,drinks,home,bought,usedDays,period)}${renderSpending(list)}<section class="panel day-panel" aria-label="每日记录">${renderDay()}</section>`:`<div class="between intro"><h1>${anchor.getMonth()+1}月的日常</h1></div>
${renderOverview(list,drinks,home,bought,usedDays,period)}
<div class="month-layout"><section class="panel calendar-panel" aria-label="${monthMode==='drink'?'饮品':'支出'}日历"><div class="panel-head between"><h2>本月汇总</h2><div class="view-switch month-mode" role="group" aria-label="月历内容">${[['drink','饮品'],['spend','支出']].map(([v,l])=>`<button data-action="month-mode" data-mode="${v}" class="${monthMode===v?'active':''}" aria-pressed="${monthMode===v}">${l}</button>`).join('')}</div></div><div class="calendar-body">${renderCalendar()}</div></section><aside id="month-detail" aria-label="当天明细"></aside></div>`}
</main><nav class="mobile-nav" aria-label="视图导航"><div class="mobile-view">${navViews(true)}</div><button class="add-fab" data-action="new-record" aria-label="新增记录">${icon('plus')}</button></nav>`;syncPeek();}

function renderOverview(list,drinks,home,bought,usedDays,period){return `<section class="overview" aria-label="${period}概览"><div class="machine-mark">${icon('machine')}</div><div class="machine-summary"><h2>${view==='day'?`咖啡机${usedDays.size?'已使用':'未使用'}`:`${period}，咖啡机用了 <strong>${usedDays.size}</strong> 天`}${view==='day'&&usedDays.size?icon('sparkles','celebrate'):''}</h2>${view==='month'?`<div class="usage-dots month" aria-label="咖啡机使用日期">${range().map(d=>`<span class="usage-dot ${usedDays.has(dateKey(d))?'used':''} ${dateKey(d)>todayKey()?'future':''}" title="${dateKey(d)}${usedDays.has(dateKey(d))?' 使用过咖啡机':' 暂无使用记录'}"></span>`).join('')}</div>`:''}</div><div class="overview-stats"><div class="stat"><div class="label">自己做的</div><div class="value">${home.length}<span class="unit">杯</span></div></div><div class="stat"><div class="label">外面买的</div><div class="value">${bought.length}<span class="unit">杯</span></div></div><div class="stat"><div class="label">${view==='day'?'已记支出':'本月支出'}</div><div class="value">${priced(list)?'<span class="small">¥</span> '+money(priceOf(list)):'—'}</div></div></div></section>`}


function spendingBreakdown(list){return [['drink','饮品','cup'],['food','吃饭','food'],['shop','购物','bag']].map(([kind,label,symbol])=>{const known=list.filter(e=>e.kind===kind&&e.cents!==null);return {kind,label,symbol,cents:priceOf(known),known:known.length}})}
function renderSpending(list){const groups=spendingBreakdown(list),total=groups.reduce((sum,g)=>sum+g.cents,0);let angle=-Math.PI/2;
const percentage=value=>total>0?(value>0&&value/total*100<.1?'<0.1%':new Intl.NumberFormat('zh-CN',{maximumFractionDigits:1}).format(value/total*100)+'%'):'—';
const wedges=groups.filter(g=>g.cents>0).map(g=>{const fraction=g.cents/total,start=angle;angle+=fraction*Math.PI*2;const color=`var(--chart-${g.kind})`;if(fraction===1)return `<circle cx="64" cy="64" r="58" fill="${color}"/>`;const x1=64+58*Math.cos(start),y1=64+58*Math.sin(start),x2=64+58*Math.cos(angle),y2=64+58*Math.sin(angle);return `<path d="M64 64 L${x1} ${y1} A58 58 0 ${fraction>.5?1:0} 1 ${x2} ${y2} Z" fill="${color}" stroke="var(--panel)" stroke-width="2" stroke-linejoin="round"/>`}).join('');
const description=total>0?groups.filter(g=>g.cents>0).map(g=>`${g.label} ${money(g.cents)}元，占${percentage(g.cents)}`).join('；'):priced(list)?'已记支出为0元，暂无占比':'暂无已记支出';
return `<section class="panel spending-panel" aria-labelledby="spending-title"><div class="spending-head between"><h2 id="spending-title">支出占比</h2></div><div class="spending-body"><div class="spending-figure"><svg class="spending-pie" viewBox="0 0 128 128" role="img" aria-label="${esc(description)}">${total>0?wedges:'<circle cx="64" cy="64" r="58" fill="var(--well)"/>'}</svg>${total===0?`<span class="spending-empty">${priced(list)?'已记支出 ¥0':'暂无已记支出'}</span>`:''}</div><div class="spending-legend">${groups.map(g=>`<div class="spending-category" data-category="${g.kind}"><span class="spending-key"><i style="background:var(--chart-${g.kind})" aria-hidden="true"></i>${icon(g.symbol)}<span>${g.label}</span></span><span class="spending-category-amount">${g.known?'¥ '+money(g.cents):'—'}</span><span class="spending-percent">${g.known?esc(percentage(g.cents)):'—'}</span></div>`).join('')}</div></div></section>`}

function calendarItem(entry,caption,kind='drink',title=''){return `<span class="calendar-item ${kind==='drink'?'cup-count':''}"><span class="calendar-art ${kind==='drink'?'':'expense-visual'}"${kind==='drink'?'':` data-category="${kind.replace('spend-','')}"`}>${stickerHTML(entry)}</span><span class="calendar-caption ${kind==='drink'?'cup-multiplier':'expense-value'}"${title?` title="${esc(title)}"`:''}>${esc(caption)}</span></span>`}
function calendarCups(cups){if(!cups.length)return '';const first=cups.reduce((a,b)=>a.createdAt<=b.createdAt?a:b);return calendarItem(first,'×'+cups.length)}

const expenseStickerPaths={
 shop:'<path d="M24 28v-9a11 11 0 0 1 22 0v9" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><path d="M24 28v-9a11 11 0 0 1 22 0v9" fill="none" stroke="#96839d" stroke-width="4" stroke-linecap="round"/><path d="M16 25h38l4 39H12Z" fill="#cabccd" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><path d="m16 27 4 34h-5Z" fill="#b5a2b9"/><path d="M26 40h18v12H26Z" fill="#eee6ef"/><path d="M30 46h10" stroke="#b4a0bb" stroke-width="2" stroke-linecap="round"/>',
 food:'<circle cx="35" cy="39" r="21" fill="#d8b893" stroke="#fff" stroke-width="5"/><circle cx="35" cy="39" r="14" fill="#f3e6d2"/><path d="M7 15v17m-4-17v11q0 6 4 6t4-6V15M7 32v30M63 15q-6 9-6 20h6v27M63 15v20" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 15v17m-4-17v11q0 6 4 6t4-6V15M7 32v30M63 15q-6 9-6 20h6v27M63 15v20" fill="none" stroke="#b39d89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'
};
const expenseStickerCache={};
function expenseStickerHTML(kind){if(!expenseStickerCache[kind])expenseStickerCache[kind]='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 75">${expenseStickerPaths[kind]||expenseStickerPaths.shop}</svg>`);return `<img class="sticker expense-sticker" data-category="${kind.replace('spend-','')}" src="${esc(expenseStickerCache[kind])}" alt="${kind==='food'?'餐盘贴纸':'购物纸袋贴纸'}" draggable="false">`}
function dominantExpense(list){return spendingBreakdown(list).reduce((best,g)=>g.known&&(!best||g.cents>best.cents)?g:best,null)}
function renderExpenseDay(day){const category=dominantExpense(day);if(!category)return '<span class="day-expense"></span>';const amount=calendarSpend(priceOf(day)),candidates=day.filter(e=>e.kind===category.kind&&(category.kind==='drink'||e.cents!==null)),first=candidates.reduce((a,b)=>!a||(category.kind!=='drink'&&b.cents>a.cents)||((category.kind==='drink'||b.cents===a.cents)&&b.createdAt<a.createdAt)?b:a,null);return `<span class="day-expense">${calendarItem(first,amount,'spend-'+category.kind,'¥'+money(priceOf(day)))}</span>`}

function calendarSpend(cents){return '¥'+(cents>=1000000?new Intl.NumberFormat('zh-CN',{notation:'compact',maximumFractionDigits:1}).format(cents/100):money(cents))}
function renderCalendar(){return `<div class="week-labels" aria-hidden="true">${['一','二','三','四','五','六','日'].map(v=>`<span>周${v}</span>`).join('')}</div><div class="calendar-grid ${view} mode-${monthMode}">${visibleDates().map(d=>{const k=dateKey(d);if(k<START_DATE)return '<div class="calendar-blank" aria-hidden="true"></div>';const day=entries().filter(e=>e.date===k),cups=day.filter(e=>e.kind==='drink'),other=d.getMonth()!==anchor.getMonth(),used=cups.some(e=>e.machine);return `<button data-action="select-day" data-date="${k}" aria-label="${d.getMonth()+1}月${d.getDate()}日，${used?'已使用咖啡机':'未使用咖啡机'}，${cups.length}杯饮品，${priced(day)?'已记支出'+money(priceOf(day))+'元':'暂无已记金额'}" aria-pressed="${k===selected}" class="day-cell ${monthMode==='drink'&&used?'machine-used':''} ${k===selected?'selected':''} ${k===todayKey()?'today':''} ${other?'other':''} ${k===justSaved?'just-saved':''}"><span class="number">${d.getDate()}</span>${monthMode==='drink'?`<span class="day-stickers">${calendarCups(cups)}</span>`:renderExpenseDay(day)}</button>`}).join('')}</div>`}


function renderDay(){return renderRecordList(selected,filter,'filter')}
function renderRecordList(k,activeFilter,action,peek=false){const all=entries().filter(e=>e.date===k).sort((a,b)=>a.createdAt-b.createdAt),list=all.filter(e=>activeFilter==='all'||e.kind===activeFilter);return `<div class="day-record-toolbar"><div class="filters" role="group" aria-label="筛选记录">${[['all','全部'],['drink','饮品'],['food','吃饭'],['shop','购物']].map(([v,l])=>`<button data-action="${action}" data-filter="${v}" class="filter ${activeFilter===v?'active':''}" aria-pressed="${activeFilter===v}">${l}</button>`).join('')}</div><p class="day-record-count">${all.filter(e=>e.kind==='drink').length} 杯 · ${all.filter(e=>e.kind!=='drink').length} 笔</p></div><div class="records ${peek?'peek-records':''}">${list.length?list.map(renderRecord).join(''):all.length?'<div class="empty"><p>暂无记录</p></div>':`<div class="empty">${stickerHTML({sticker:'mug',name:'默认咖啡杯贴纸'})}<p>暂无记录</p></div>`}</div>`}


function renderRecord(e){return `<article class="record"><div class="record-image">${stickerHTML(e)}</div><div class="record-text"><button class="record-name" data-action="edit" data-id="${esc(e.id)}">${esc(e.name)}</button><div class="record-meta"><span class="tag">${e.kind==='drink'?(e.source==='home'?'自己做的':'外面买的'):e.kind==='food'?'吃饭':'购物'}</span>${e.machine?'<span class="tag machine">咖啡机</span>':''}</div></div>${e.cents===null?'':`<span class="record-money">¥ ${money(e.cents)}</span>`}<button class="record-more" data-action="edit" data-id="${esc(e.id)}" aria-label="编辑${esc(e.name)}">${icon('more')}</button></article>`}
function toast(message,action=null){clearTimeout(toastTimer);undoAction=action;const t=$('#toast');t.innerHTML=`<span>${esc(message)}</span>${action?'<button data-action="undo">撤销</button>':''}`;t.classList.remove('hidden');toastTimer=setTimeout(()=>{t.classList.add('hidden');undoAction=null},action?7000:4000)}
async function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('cup-and-day-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('book');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(new Error('blocked'))})}
async function load(){try{db=await openDB();const stored=await new Promise((resolve,reject)=>{const r=db.transaction('book').objectStore('book').get('state');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(stored)state=validateState(stored)}catch(e){storageError=true}applyTheme();render()}
async function persist(){try{if(!db)db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction('book','readwrite');tx.objectStore('book').put(state,'state');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});storageError=false;return true}catch(e){storageError=true;return false}}
function themeValue(){try{return localStorage.getItem('life-book-theme')||'system'}catch{return 'system'}}
function applyTheme(value=themeValue()){document.documentElement.classList.toggle('dark',value==='dark'||(value==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyTheme());
function setView(v){if(!['day','month'].includes(v))return;closePeek(false);if(v==='day'){selected=todayKey();anchor=parseDate(selected)}else{anchor=new Date(monthAnchor);syncMonthSelection()}view=v;filter='all';render()}
function navigate(dir){if(dir<0&&!canNavigateBack())return;if(view==='day'){selected=dateKey(addDay(parseDate(selected),dir));anchor=parseDate(selected)}else{anchor=new Date(anchor.getFullYear(),anchor.getMonth()+dir,1,12);monthAnchor=new Date(anchor);syncMonthSelection()}justSaved='';filter='all';render()}


let pickerMonth;
function syncMonthSelection(){const d=parseDate(selected),last=new Date(anchor.getFullYear(),anchor.getMonth()+1,0).getDate();selected=dateKey(new Date(anchor.getFullYear(),anchor.getMonth(),Math.min(d.getDate(),last),12));if(selected<START_DATE)selected=START_DATE}
function renderDatePicker(){const y=pickerMonth.getFullYear(),m=pickerMonth.getMonth(),first=monday(new Date(y,m,1,12)),n=Math.ceil((new Date(y,m+1,0).getDate()+(new Date(y,m,1).getDay()+6)%7)/7)*7;
$('#date-picker').innerHTML=`<div class="picker-toolbar"><button class="picker-arrow" data-action="picker-prev" aria-label="上个月" ${y===2026&&m===10?'disabled':''}>${icon('left')}</button><div class="picker-select picker-select-year"><select id="picker-year" aria-label="年份">${Array.from({length:74},(_,i)=>2026+i).map(v=>`<option value="${v}" ${v===y?'selected':''}>${v}年</option>`).join('')}</select>${icon('down')}</div><div class="picker-select"><select id="picker-month" aria-label="月份">${Array.from({length:12},(_,i)=>`<option value="${i}" ${i===m?'selected':''} ${y===2026&&i<10?'disabled':''}>${i+1}月</option>`).join('')}</select>${icon('down')}</div><button class="picker-arrow" data-action="picker-next" aria-label="下个月" ${y===2099&&m===11?'disabled':''}>${icon('right')}</button></div><div class="picker-week" aria-hidden="true">${['一','二','三','四','五','六','日'].map(v=>`<span>${v}</span>`).join('')}</div><div class="picker-grid">${Array.from({length:n},(_,i)=>{const d=addDay(first,i),k=dateKey(d);return d.getMonth()!==m?'<span></span>':`<button data-action="picker-day" data-date="${k}" ${k<START_DATE?'disabled':''} class="${k===selected?'selected':''} ${k===todayKey()?'today':''}" aria-label="${y}年${m+1}月${d.getDate()}日" aria-pressed="${k===selected}">${d.getDate()}</button>`}).join('')}</div>`}
function showDatePicker(){const picker=$('#date-picker'),button=$('[data-action="open-picker"]');if(picker.matches(':popover-open'))return;pickerMonth=new Date(anchor.getFullYear(),anchor.getMonth(),1,12);renderDatePicker();const r=button.getBoundingClientRect(),w=Math.min(300,innerWidth-24);picker.style.width=w+'px';picker.style.left=Math.max(12,Math.min(r.left+r.width/2-w/2,innerWidth-w-12))+'px';picker.style.top=(r.bottom+10)+'px';}
function movePicker(dir){const next=new Date(pickerMonth.getFullYear(),pickerMonth.getMonth()+dir,1,12);if(next<new Date(2026,10,1,12)||next>new Date(2099,11,1,12))return;pickerMonth=next;renderDatePicker();$('#date-picker [data-action="picker-'+(dir<0?'prev':'next')+'"]').focus()}
function chooseDate(k){if(!validDate(k)||k<START_DATE)return;closePeek(false);$('#date-picker').hidePopover();selected=k;anchor=parseDate(k);if(view==='month')monthAnchor=new Date(anchor);justSaved='';filter='all';render();$('[data-action="open-picker"]').focus()}
$('#date-picker').addEventListener('toggle',e=>{$('[data-action="open-picker"]')?.setAttribute('aria-expanded',String(e.newState==='open'));if(e.newState==='open')($('#date-picker .selected:not(:disabled)')||$('#date-picker [data-action="picker-day"]:not(:disabled)'))?.focus()});
$('#date-picker').addEventListener('change',e=>{const year=Number($('#picker-year').value),month=Number($('#picker-month').value);pickerMonth=new Date(year,year===2026?Math.max(10,month):month,1,12);const id=e.target.id;renderDatePicker();$('#'+id).focus()});
window.addEventListener('resize',()=>{if($('#date-picker').matches(':popover-open'))$('#date-picker').hidePopover()});


const peekMobile=()=>matchMedia('(max-width:900px)').matches;
function peekContent(){return `<div class="peek-shell">${renderRecordList(peekDate,peekFilter,'peek-filter',true)}</div>`}
function syncPeek(){const sheet=$('#month-sheet'),slot=$('#month-detail'),active=view==='month'&&!!peekDate,mobile=peekMobile();$('.month-layout')?.classList.toggle('has-peek',active&&!mobile);$('.month-home')?.classList.toggle('has-peek',active&&!mobile);if(slot)slot.innerHTML=active&&!mobile?`<section class="panel peek-panel">${peekContent()}</section>`:'';if(active&&mobile){sheet.innerHTML='<div class="sheet-grip" aria-hidden="true"><span></span></div>'+peekContent();document.body.classList.add('peek-open');if(!sheet.open)sheet.showModal()}else{if(sheet.open)sheet.close();sheet.innerHTML='';document.body.classList.remove('peek-open')}}
function openPeek(k){if(view!=='month'||!validDate(k)||k<START_DATE)return;if(!peekDate)peekScroll=window.scrollY;selected=k;peekDate=k;peekFilter='all';$('.calendar-body').innerHTML=renderCalendar();syncPeek()}
function closePeek(restore=true){const hadSheet=$('#month-sheet').open;peekDate=null;peekFilter='all';syncPeek();if(restore){if(hadSheet)window.scrollTo(0,peekScroll);const target=$('.day-cell[data-date="'+selected+'"]');target?.focus({preventScroll:true})}}
$('#month-sheet').addEventListener('cancel',e=>{e.preventDefault();closePeek()});
document.addEventListener('click',e=>{if(peekDate&&!peekMobile()&&!e.target.closest('#month-detail,.day-cell,button,input,select,a,dialog,#date-picker'))closePeek()});
let previousPeekMobile=peekMobile();window.addEventListener('resize',()=>{const mobile=peekMobile();if(mobile!==previousPeekMobile){previousPeekMobile=mobile;syncPeek()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&peekDate&&!peekMobile()&&!document.querySelector('dialog[open]')&&!$('#date-picker').matches(':popover-open')){e.preventDefault();closePeek()}});

function showEntry(kind='drink',id=null){if(view==='month'&&!peekDate)peekScroll=window.scrollY;const existing=id&&entries().find(e=>e.id===id);draft=existing?{...existing}:{id:null,date:selected,kind,source:'home',machine:kind==='drink',name:'',sticker:'mug',photoId:null,cents:null,createdAt:Date.now()};photoJob++;photoBusy=false;photoInputBusy=false;draft.newPhoto=null;draft.originalPhoto=null;renderEntry();$('#entry-dialog').showModal()}
function renderEntry(){if(!draft)return;const isDrink=draft.kind==='drink',p=draft.newPhoto||photoFor(draft.photoId),recent=allStickers().slice(-8).reverse();$('#entry-dialog').innerHTML=`<div class="dialog-shell"><div class="dialog-head between"><h2 id="entry-title">${draft.id?'编辑记录':isDrink?'记饮品':'记花销'}</h2><button class="icon-btn" data-action="close-entry" aria-label="关闭">${icon('close')}</button></div><form id="entry-form" class="dialog-content"><div class="entry-tabs"><button type="button" data-action="entry-kind" data-kind="drink" class="${isDrink?'active':''}">饮品</button><button type="button" data-action="entry-kind" data-kind="food" class="${!isDrink?'active':''}">吃饭 / 购物</button></div>
${isDrink?`<div class="field"><span class="field-label">来源</span><div class="choice-row">${[['home','自己做的'],['bought','外面买的']].map(([v,l])=>`<button type="button" class="choice ${draft.source===v?'active':''}" data-action="source" data-source="${v}" aria-pressed="${draft.source===v}">${l}</button>`).join('')}</div></div>`:`<div class="field"><span class="field-label">分类</span><div class="choice-row">${[['food','吃饭'],['shop','购物']].map(([v,l])=>`<button type="button" class="choice ${draft.kind===v?'active':''}" data-action="expense-kind" data-kind="${v}" aria-pressed="${draft.kind===v}">${l}</button>`).join('')}</div></div>`}
<div class="field"><label for="entry-name">${isDrink?'喝了什么':'买了什么'}</label><input id="entry-name" class="input" name="name" value="${esc(draft.name)}" placeholder="名称" maxlength="60" required autocomplete="off">${isDrink?`<div class="chips">${['美式','拿铁','浓缩','茶','奶茶'].map(n=>`<button class="chip" type="button" data-action="name-preset" data-name="${n}">${n}</button>`).join('')}</div>`:''}</div>
${isDrink&&draft.source==='home'?`<div class="machine-option"><input id="entry-machine" type="checkbox" ${draft.machine?'checked':''}><label for="entry-machine">这杯用了咖啡机</label>${icon('machine')}</div>`:''}
<div class="field"><label for="entry-price">${isDrink?(draft.source==='home'?'这杯成本':'花了多少'):'花了多少'} ${isDrink?'<span class="optional">选填</span>':''}</label><input id="entry-price" class="input" name="price" inputmode="decimal" type="text" placeholder="¥" value="${esc(draft.priceText??(draft.cents===null?'':(draft.cents/100).toFixed(draft.cents%100?2:0)))}" ${!isDrink?'required':''} maxlength="12"></div>
<div class="field"><span class="field-label">贴纸 <span class="optional">选填照片</span></span><div class="photo-area"><div class="photo-preview" id="photo-preview">${p?`<img class="sticker photo-sticker ${p.cutout?'':'original'}" src="${esc(p.data)}" alt="照片预览">`:stickerHTML(draft)}</div><div class="photo-tools"><div class="row wrap"><button type="button" class="btn secondary" data-action="photo">${icon('photo')}${p?'换张照片':'拍照 / 选照片'}</button>${p?'<button class="text-btn" type="button" data-action="remove-photo">用默认贴纸</button>':''}</div>${p?`<div class="row wrap" style="margin-top:5px"><button type="button" class="btn secondary" id="cutout-button" data-action="cutout">${p.cutout?'重新抠图':'变成贴纸'}</button>${draft.originalPhoto?'<button class="text-btn" type="button" data-action="original-photo">使用原图</button>':''}</div>`:''}</div></div><p class="photo-message" id="photo-message"></p>${isDrink?`<div class="sticker-options" aria-label="默认贴纸">${Object.keys(stickerPaths).map(t=>`<button type="button" class="sticker-option ${!p&&draft.sticker===t?'active':''}" data-action="sticker" data-sticker="${t}" aria-label="${stickerNames[t]}" aria-pressed="${!p&&draft.sticker===t}">${stickerHTML({sticker:t,name:stickerNames[t]})}</button>`).join('')}</div>`:''}${recent.length?`<p class="small muted" style="margin-top:12px">我的贴纸</p><div class="recent-photos">${recent.map(p=>`<button type="button" class="recent-photo" data-action="reuse-photo" data-id="${esc(p.id)}" aria-label="复用${esc(p.name||'记录')}照片贴纸"><img src="${esc(p.data)}" alt="${esc(p.name||'照片贴纸')}"></button>`).join('')}</div>`:''}</div><p id="entry-error" class="form-error" role="alert"></p></form><div class="dialog-foot">${draft.id?`<button class="text-btn danger delete-btn" data-action="delete-entry">删除记录</button>`:''}<button class="btn" data-action="close-entry">取消</button><button class="btn primary" form="entry-form" type="submit" id="save-entry">${draft.id?'保存修改':'保存记录'}</button></div></div>`;}
function readDraft(){if(!draft)return;draft.name=$('#entry-name')?.value||'';const text=$('#entry-price')?.value.trim()||'';draft.priceText=text;draft.cents=text!==''&&/^\d+(\.\d{1,2})?$/.test(text)?Math.round(Number(text)*100):null;if($('#entry-machine'))draft.machine=$('#entry-machine').checked}
function updateDraftRender(fn){readDraft();photoJob++;photoBusy=false;photoInputBusy=false;fn();renderEntry()}
async function saveEntry(event){event.preventDefault();if(saveBusy||!draft)return;if(photoBusy||photoInputBusy){$('#entry-error').textContent='照片还在处理中，可以等待完成，或先取消照片处理。';return}readDraft();const name=draft.name.trim(),text=draft.priceText;if(!name){$('#entry-error').textContent='请填写名称。';$('#entry-name').focus();return}if(text&&!/^\d+(\.\d{1,2})?$/.test(text)||text&&(!Number.isFinite(Number(text))||Number(text)>9999999.99)){ $('#entry-error').textContent='金额请填 0 到 9,999,999.99 之间的数字，最多两位小数。';$('#entry-price').focus();return}if(draft.kind!=='drink'&&!text){$('#entry-error').textContent='请填写金额。';return}if(!validDate(draft.date)||draft.date<START_DATE){$('#entry-error').textContent='请选择 2026 年 11 月 2 日起的日期。';return}saveBusy=true;$('#save-entry').disabled=true;const target=state;let photoId=draft.photoId;if(draft.newPhoto){const p={...draft.newPhoto,id:uid(),name};target.stickers.push(p);photoId=p.id}const e={id:draft.id||uid(),date:draft.date,kind:draft.kind,name,cents:draft.cents,source:draft.kind==='drink'?draft.source:null,machine:draft.kind==='drink'&&draft.source==='home'&&!!draft.machine,sticker:draft.sticker,photoId,createdAt:draft.createdAt};const i=target.entries.findIndex(v=>v.id===e.id);if(i>=0)target.entries[i]=e;else target.entries.push(e);target.stickers=target.stickers.filter(p=>target.entries.some(e=>e.photoId===p.id)||p.id===photoId);const saved=await persist();if(view==='month'){monthAnchor=new Date(anchor);peekDate=e.date}else anchor=parseDate(e.date);selected=e.date;filter='all';justSaved=selected;$('#entry-dialog').close();draft=null;photoJob++;saveBusy=false;render();toast(saved?(i>=0?'已更新':'已保存'):'记录暂存在页面中，请先导出备份');}
function validDate(s){return /^20\d{2}-\d{2}-\d{2}$/.test(s)&&dateKey(parseDate(s))===s}
async function processPhoto(file){if(!draft||!file)return;if(file.size>25*1024*1024){toast('这张照片超过 25 MB，请选择小一点的图片');return}readDraft();const job=++photoJob;photoBusy=false;photoInputBusy=true;$('#save-entry').disabled=true;$('#photo-message').textContent='正在准备照片…';try{const data=await resizeImage(file,1000,false);if(job!==photoJob||!draft)return;const p={data,cutout:false};draft.newPhoto=p;draft.originalPhoto=p;draft.photoId=null;photoInputBusy=false;renderEntry();await cutoutPhoto()}catch(e){if(job!==photoJob||!draft)return;photoInputBusy=false;renderEntry();$('#photo-message').classList.add('error');$('#photo-message').textContent='这张照片暂时打不开，请试试 JPG、PNG 或相册导出的照片。'}}
function imageFrom(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('image decode'));img.src=src})}
async function resizeImage(blob,max=600,transparent=false){const url=URL.createObjectURL(blob);try{const img=await imageFrom(url);if(!img.width||!img.height)throw new Error('empty image');const ratio=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL(transparent?'image/png':'image/jpeg',.86)}finally{URL.revokeObjectURL(url)}}
async function trimCutout(blob){const url=URL.createObjectURL(blob);try{const img=await imageFrom(url),c=document.createElement('canvas');c.width=img.width;c.height=img.height;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);const data=ctx.getImageData(0,0,c.width,c.height).data;let left=c.width,top=c.height,right=-1,bottom=-1;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){if(data[(y*c.width+x)*4+3]>35){left=Math.min(left,x);right=Math.max(right,x);top=Math.min(top,y);bottom=Math.max(bottom,y)}}if(right<0)throw new Error('empty cutout');const w=right-left+1,h=bottom-top+1,r=Math.min(1,500/Math.max(w,h)),pad=8,out=document.createElement('canvas');out.width=Math.ceil(w*r)+pad*2;out.height=Math.ceil(h*r)+pad*2;out.getContext('2d').drawImage(c,left,top,w,h,pad,pad,w*r,h*r);return out.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}
async function cutoutPhoto(){if(!draft||photoBusy)return;readDraft();const current=draft.originalPhoto||draft.newPhoto||photoFor(draft.photoId);if(!current)return;const job=++photoJob;photoBusy=true;const button=$('#cutout-button');if(button){button.disabled=true;button.textContent='正在制作…'}$('#save-entry').disabled=true;const msg=$('#photo-message');msg.classList.remove('error');msg.textContent='正在下载抠图模型…';let slowTimer=setTimeout(()=>{if(job===photoJob&&draft)msg.textContent='处理中，首次下载较慢。'},20000);if(!draft.originalPhoto)draft.originalPhoto=current;
try{removeModule ||= import('https://esm.sh/@imgly/background-removal@1.7.0?bundle').catch(e=>{removeModule=null;throw e});const mod=await removeModule;if(job!==photoJob||!draft)return;const src=await (await fetch(current.data)).blob();const result=await mod.removeBackground(src,{device:'cpu',model:'isnet_quint8',proxyToWorker:false,output:{format:'image/png',type:'foreground'},progress:(key,cur,total)=>{if(job===photoJob&&draft&&total)msg.textContent=`正在准备抠图资源 ${Math.round(cur/total*100)}%`;}});const data=await trimCutout(result);if(job!==photoJob||!draft)return;draft.newPhoto={data,cutout:true};draft.photoId=null;photoBusy=false;renderEntry();$('#photo-message').textContent='贴纸已生成'}catch(e){if(job!==photoJob||!draft)return;photoBusy=false;renderEntry();$('#photo-message').classList.add('error');$('#photo-message').textContent='抠图未完成，原照片已保留。请重试或使用原图。'}finally{clearTimeout(slowTimer)}}
function showSettings(){const dialog=$('#settings-dialog');dialog.innerHTML=`<div class="dialog-shell"><div class="dialog-head between"><h2 id="settings-title">生活本设置</h2><button class="icon-btn" data-action="close-settings" aria-label="关闭设置">${icon('close')}</button></div><div class="dialog-content"><div class="settings-row"><strong>外观</strong><div class="theme-options">${[['light','浅色'],['dark','深色'],['system','跟随系统']].map(([v,l])=>`<button data-action="theme" data-theme="${v}" class="${themeValue()===v?'active':''}" aria-pressed="${themeValue()===v}">${l}</button>`).join('')}</div></div><div class="settings-row"><strong>备份</strong><p>${state.entries.length} 条记录 · ${state.stickers.length} 张照片 · 当前浏览器</p><div class="settings-actions"><button class="btn secondary" data-action="export">${icon('download')}导出</button><button class="btn secondary" data-action="import">${icon('upload')}导入</button></div><p id="import-message" role="status"></p></div><div class="settings-info"><a href="https://github.com/imgly/background-removal-js" target="_blank" rel="noopener noreferrer">抠图组件 · AGPL-3.0</a></div></div><div class="dialog-foot"><button class="btn primary" data-action="close-settings">完成</button></div></div>`;if(!dialog.open)dialog.showModal()}
function confirmAction(title,content,label,fn){const dialog=$('#confirm-dialog');dialog.innerHTML=`<div class="dialog-shell"><div class="dialog-head"><h2 id="confirm-title">${esc(title)}</h2></div><div class="dialog-content"><p class="small muted" style="line-height:1.9">${esc(content)}</p></div><div class="dialog-foot"><button class="btn" data-action="cancel-confirm">取消</button><button class="btn primary" id="confirm-yes">${esc(label)}</button></div></div>`;$('#confirm-yes').onclick=async()=>{dialog.close();await fn()};dialog.showModal()}
async function deleteEntry(){if(!draft?.id)return;const id=draft.id,name=draft.name;confirmAction('删除这条记录？',`「${name}」会从日历和统计中移除。`,'删除',async()=>{const target=state,old=target.entries.find(e=>e.id===id);target.entries=target.entries.filter(e=>e.id!==id);const ok=await persist();$('#entry-dialog').close();draft=null;photoJob++;render();toast(ok?'记录已删除':'删除尚未持久保存，请导出备份',async()=>{target.entries.push(old);await persist();render();toast('已恢复记录')})})}
function validateState(data){if(!data||data.version!==1||!Array.isArray(data.entries)||!Array.isArray(data.stickers)||data.entries.length>50000||data.stickers.length>10000)throw new Error('invalid backup');const ids=new Set(),photos=new Set();const stickers=data.stickers.map(p=>{if(!p||typeof p.id!=='string'||photos.has(p.id)||!/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(p.data)||p.data.length>8000000)throw new Error('invalid photo');photos.add(p.id);return {id:p.id,data:p.data,cutout:!!p.cutout,name:String(p.name||'').slice(0,60)}});const es=data.entries.map(e=>{if(!e||typeof e.id!=='string'||ids.has(e.id)||!validDate(e.date)||!['drink','food','shop'].includes(e.kind)||typeof e.name!=='string'||!e.name.trim()||e.name.length>60||!(e.cents===null||Number.isSafeInteger(e.cents)&&e.cents>=0&&e.cents<=999999999)||e.kind!=='drink'&&e.cents===null||e.kind==='drink'&&!['home','bought'].includes(e.source)||e.photoId&&!photos.has(e.photoId))throw new Error('invalid entry');ids.add(e.id);return {id:e.id,date:e.date,kind:e.kind,name:e.name,cents:e.cents,source:e.kind==='drink'?e.source:null,machine:e.kind==='drink'&&e.source==='home'&&!!e.machine,sticker:Object.hasOwn(stickerPaths,e.sticker)?e.sticker:'mug',photoId:e.photoId||null,createdAt:Number.isFinite(e.createdAt)?e.createdAt:0}});return {version:1,entries:es,stickers}}
function exportBackup(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=`生活本备份-${todayKey()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('已导出自己的记录和照片贴纸')}
async function importBackup(file){if(!file)return;if(file.size>100*1024*1024){toast('备份文件过大，请选择 100 MB 以下的文件');return}let incoming;try{incoming=validateState(JSON.parse(await file.text()))}catch(e){$('#import-message').textContent='这份文件不是有效的生活本备份，请重新选择。';return}confirmAction('合并这份备份？',`将导入 ${incoming.entries.length} 条记录。相同编号的记录保留当前版本，其余合并，不会清空现有记录。`,'合并记录',async()=>{const entryMap=new Map(incoming.entries.map(e=>[e.id,e])),photoMap=new Map(incoming.stickers.map(e=>[e.id,e]));state.entries.forEach(e=>entryMap.set(e.id,e));state.stickers.forEach(e=>photoMap.set(e.id,e));const merged={version:1,entries:[...entryMap.values()],stickers:[...photoMap.values()]};try{state=validateState(merged)}catch{toast('合并后的记录超过容量或格式不兼容，请保留原备份');return}const ok=await persist();render();showSettings();toast(ok?'备份已合并':'合并暂存在页面中，请立即导出备份')})}
document.addEventListener('click',async event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;switch(a){case'month-mode':if(!['drink','spend'].includes(b.dataset.mode))break;monthMode=b.dataset.mode;render();break;case'open-picker':showDatePicker();break;case'picker-prev':movePicker(-1);break;case'picker-next':movePicker(1);break;case'picker-day':chooseDate(b.dataset.date);break;case'prev':navigate(-1);break;case'next':navigate(1);break;case'today':closePeek(false);selected=todayKey();anchor=parseDate(selected);if(view==='month')monthAnchor=new Date(anchor);filter='all';render();break;case'view':setView(b.dataset.view);break;case'select-day':openPeek(b.dataset.date);break;case'close-peek':closePeek();break;case'peek-filter':peekFilter=b.dataset.filter;syncPeek();break;case'filter':filter=b.dataset.filter;render();break;case'new-record':if(view==='month')monthAnchor=new Date(anchor);showEntry('drink');break;case'edit':showEntry('drink',b.dataset.id);break;case'close-entry':$('#entry-dialog').close();photoJob++;photoBusy=false;draft=null;break;case'entry-kind':updateDraftRender(()=>{const changed=(draft.kind==='drink')!==(b.dataset.kind==='drink');draft.kind=b.dataset.kind;if(changed){draft.name='';draft.cents=null;draft.priceText='';draft.photoId=null;draft.newPhoto=null;draft.originalPhoto=null;draft.machine=draft.kind==='drink'&&draft.source==='home';}});break;case'expense-kind':updateDraftRender(()=>{draft.kind=b.dataset.kind});break;case'source':updateDraftRender(()=>{draft.source=b.dataset.source;draft.machine=draft.source==='home';draft.sticker=draft.source==='home'?'mug':'takeaway'});break;case'name-preset':updateDraftRender(()=>{draft.name=b.dataset.name;draft.sticker=({美式:draft.source==='home'?'mug':'takeaway',拿铁:'latte',浓缩:'espresso',茶:'tea',奶茶:'pink'})[draft.name];draft.machine=draft.source==='home'&&!['茶','奶茶'].includes(draft.name)});break;case'sticker':updateDraftRender(()=>{draft.sticker=b.dataset.sticker;draft.photoId=null;draft.newPhoto=null;draft.originalPhoto=null});break;case'photo':$('#photo-file').value='';$('#photo-file').click();break;case'cutout':await cutoutPhoto();break;case'remove-photo':updateDraftRender(()=>{draft.photoId=null;draft.newPhoto=null;draft.originalPhoto=null});break;case'original-photo':updateDraftRender(()=>{draft.newPhoto=draft.originalPhoto;draft.photoId=null});break;case'reuse-photo':updateDraftRender(()=>{draft.photoId=b.dataset.id;draft.newPhoto=null;draft.originalPhoto=null});break;case'settings':showSettings();break;case'close-settings':$('#settings-dialog').close();break;case'theme':try{localStorage.setItem('life-book-theme',b.dataset.theme)}catch{}applyTheme(b.dataset.theme);showSettings();break;case'delete-entry':await deleteEntry();break;case'cancel-confirm':$('#confirm-dialog').close();break;case'export':exportBackup();break;case'import':$('#backup-file').value='';$('#backup-file').click();break;case'undo':if(undoAction){const fn=undoAction;undoAction=null;await fn()}break;}});
document.addEventListener('submit',event=>{if(event.target.id==='entry-form')saveEntry(event)});
$('#photo-file').addEventListener('change',event=>processPhoto(event.target.files[0]));
$('#backup-file').addEventListener('change',event=>importBackup(event.target.files[0]));
$('#entry-dialog').addEventListener('cancel',()=>{photoJob++;photoBusy=false;draft=null});
for(const dialog of document.querySelectorAll('dialog'))dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){if(dialog.id==='month-sheet'){closePeek();return}dialog.close();if(dialog.id==='entry-dialog'){photoJob++;photoBusy=false;draft=null}}}});
load();
</script>
